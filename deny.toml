[graph]
# Judge the dependency graph for every platform this project ships on, not
# just the OS running the check. CI runs cargo-deny on a single (Linux)
# runner; without an explicit target list cargo-deny resolves only that
# host's graph, so a macOS- or Windows-only dependency with a bad license or
# an open advisory would never be evaluated and would pass silently.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Same reasoning as `targets`: a feature-gated dependency pulled in only by a
# non-default feature (e.g. `gallery-source`) must still be judged, or it
# passes the gate by virtue of not being built today.
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Each reason names the chain; every entry is reachable only through the
  # pinned `gpui-pre` 0.3.5 family, which this workspace cannot change. An
  # entry cargo-deny reports as `advisory-not-detected` is dead and goes.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained but only reachable transitively via gpui-pre 0.3.5 / usvg / fontdue; no safe upgrade exists" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained but only reachable transitively via gpui-pre 0.3.5 / cosmic-text / usvg; no safe upgrade exists" },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only reachable transitively via gpui-pre 0.3.5; no safe upgrade exists" },
]

[bans]
multiple-versions = "warn"
# A wildcard dependency (`foo = "*"`) accepts any future release, including
# one with a yanked or vulnerable version, and cargo-deny would otherwise
# never flag it because "*" satisfies every advisory and license check by
# construction. Deny it so a wildcard has to be replaced with a real
# version requirement before it lands.
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No `allow-git`: every dependency, GPUI included, comes from crates.io (a git
# dependency makes a crate unpublishable, and `.shots/package_audit.py` fails
# on one in Cargo.lock), so any git source is denied outright.
