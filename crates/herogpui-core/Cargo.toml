[package]
name = "herogpui-core"
description = "Core utilities and shared types for HeroGPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gpui.workspace = true

[lints]
workspace = true

# docs.rs builds every crate with only its default features unless told
# otherwise; `all-features` keeps this crate's docs.rs page in step with
# herogpui-components' (which does gate items behind a feature) rather than
# leaving that one crate the only one documented completely. `--cfg docsrs`
# matches the flag CI's own rustdoc job now sets (see
# .github/workflows/ci.yml), so a `#[cfg(docsrs)]` doc-only annotation
# behaves identically in both places.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
