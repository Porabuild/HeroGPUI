name: rust-env
description: >-
  Shared setup for the Rust gate jobs: the Linux system libraries GPUI links
  against (Linux runners only), which optimization level the workspace crates
  build at, and the dependency cache that job builds against.

inputs:
  profile:
    description: >-
      `fast` builds the workspace crates at -O0; `real` keeps Cargo.toml's
      profile for them. Dependencies stay at Cargo.toml's -O3 either way, so
      both profiles read and write the same dependency cache.
    default: fast
    type: choice
    options:
      - fast
      - real

runs:
  using: composite
  steps:
    - name: Disable Windows Defender and configure exclusions
      # Windows-only. GitHub Actions Windows runners run Defender by default.
      # Scanning every .rlib, .rmeta, .exe, and cache tar extraction causes
      # massive disk I/O bottlenecks and file-locking delays during compilation.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableScriptScanning $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath @("$env:USERPROFILE\.cargo", "$env:GITHUB_WORKSPACE", "D:\a", "$env:TEMP", "$env:TMP") -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess @("cargo.exe", "rustc.exe", "rust-lld.exe", "tar.exe") -ErrorAction SilentlyContinue
        } catch {
          Write-Host "Warning: Could not adjust Defender preferences: $_"
        }

    - name: Install Linux build dependencies
      # Linux-only, and skipped rather than faked on the other hosts: these
      # are the system libraries the gpui Linux platform crates link against.
      # macOS needs nothing beyond the runner's SDK (Metal arrives through
      # objc2 bindings), and Windows links through the windows crate's import
      # libraries with the rust-lld pin in .cargo/config.toml — so the macOS
      # and Windows matrix legs of the test jobs install nothing here.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          pkg-config \
          libvulkan-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libx11-dev \
          libxcb1-dev \
          libx11-xcb-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libfontconfig-dev \
          libfreetype-dev

    # The gate is compile-bound, not test-bound: its 70 test binaries finish in
    # five seconds, while the `test` job measured 842s at Cargo.toml's profile
    # and 107s unoptimized. Cargo.toml's `-O1` workspace / `-O3` dependencies is
    # a local-dev choice -- a gallery you interact with should be responsive --
    # and only the workspace half is on a PR's critical path, because
    # dependencies come out of the cache. So unoptimize that half and nothing
    # else.
    #
    # The `nothing else` is measured, not cautious. Dropping dependencies to -O0
    # too made `assert_settled` in dropdown_viewport_deep fail 40 runs out of 40
    # -- a height-capped panel is laid out twice per frame and its reported
    # height lands a pixel either side depending on codegen. Keeping
    # dependencies at Cargo.toml's -O3 gave 0 failures in 92 runs. That keeps
    # every test assertion exact, and it keeps CI's dependencies identical to a
    # developer's, which is the point of a gate.
    #
    # In addition, Cargo.toml's `debug = "line-tables-only"` generates PDB
    # files on Windows for all 70+ test binaries, saturating disk I/O and
    # inflating cache tarballs. In CI, setting `debug = 0` eliminates PDB
    # generation completely without affecting test assertion behavior.
    # Codegen-units = 16 reduces object file disk thrashing on 2-vCPU runners.
    #
    # The override goes in $CARGO_HOME rather than as a `--config` flag because
    # `.shots/lint.ps1` owns its own cargo invocation. One config file reaches
    # every call in a job, and calls within a job that disagree about the
    # profile would rebuild the workspace and thrash that job's cache.
    - name: Configure Cargo dev profile for CI
      shell: bash
      run: |
        set -euo pipefail
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        mkdir -p "$cargo_home"
        if grep -q "^\[profile\.dev\]$" "$cargo_home/config.toml" 2>/dev/null; then
          echo "::warning::$cargo_home/config.toml already defines [profile.dev]; not overriding it."
        else
          if [ "${{ inputs.profile }}" = "fast" ]; then
            printf '\n[profile.dev]\nopt-level = 0\ndebug = 0\nstrip = "debuginfo"\ncodegen-units = 16\n' >> "$cargo_home/config.toml"
          else
            printf '\n[profile.dev]\ndebug = 0\nstrip = "debuginfo"\ncodegen-units = 16\n' >> "$cargo_home/config.toml"
          fi
        fi
        # Echo it. A silent no-op here surfaces as an unexplained slow gate in
        # every step downstream, which is an awful thing to debug from timings.
        cat "$cargo_home/config.toml"

    # One cache per job, not one shared cache. Keyed per job, each one
    # restores what it actually builds against.
    # We set prefix-key and key with the profile to isolate fast vs real caches,
    # and enable cache-workspace-crates so warm runs skip compiling unchanged test crates.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust
        key: ${{ inputs.profile }}
        cache-all-crates: true
        cache-workspace-crates: true
