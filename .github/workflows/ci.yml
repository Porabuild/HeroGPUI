name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same PR/ref cancels the superseded run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The PR gate: fast Linux runner running the full format, lint, test, and doc battery.
  # Cheap checks fail first: fmt -> workspace lints -> clippy -> cargo-deny -> tests -> docs.
  check:
    name: Check & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev \
            libfreetype-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint gate (workspace lints, clippy -D warnings, cargo-deny)
        shell: pwsh
        run: .shots/lint.ps1

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
