name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same PR/ref cancels the superseded run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The PR gate: fast Linux runner running the full format, lint, test, and doc battery.
  # Cheap checks fail first: fmt -> workspace lints -> clippy -> cargo-deny -> tests -> docs.
  check:
    name: Check & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev \
            libfreetype-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The website gates run from the same checkout: extract:check compares the
      # generated component data against the Rust gallery, so it needs both.
      # There is no root package.json, so the action has to be told where the
      # pinned "packageManager" lives; without it the step fails outright
      # rather than defaulting to a version.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Component gallery sync
        working-directory: web
        run: pnpm run extract:check

      - name: Website typecheck, lint and production build
        working-directory: web
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build

      - name: Lint gate (workspace lints, clippy -D warnings, cargo-deny)
        shell: pwsh
        run: .shots/lint.ps1

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # The parity contract. These read the pinned v3.2.4 bundle checked in at
  # .shots/heroui-bundle.txt.gz, so they need no network and no Rust build --
  # they read the Rust sources as text. Kept off the Check job so a parity
  # regression and a compile error report separately.
  parity:
    name: HeroUI v3.2.4 parity audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit set
        run: |
          set -euo pipefail
          for audit in .shots/*audit.py; do
            echo "==> $audit"
            python "$audit"
          done
          echo "==> .shots/write_only.py"
          python .shots/write_only.py

  # Git GPUI is not registry-publishable; validate installation from source.
  install:
    name: Source install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev \
            libfreetype-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install the gallery CLI from source
        run: cargo install --path gallery --locked --debug --force
