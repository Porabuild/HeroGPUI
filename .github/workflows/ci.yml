name: CI

on:
  pull_request:
    # `labeled`/`unlabeled` on top of the defaults so the two opt-in labels
    # take effect when they are added or removed, not on the next push:
    # `ci:opt-levels` runs the `optimized` suite on the pull request, and
    # `semver:breaking` lets the `semver` job accept a breaking change (see
    # both jobs). Any label change re-runs the workflow; `concurrency` below
    # cancels the run it supersedes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
  workflow_dispatch:
  # release.yml calls this whole workflow on the tagged commit, so nothing is
  # published unless the full gate (every job `ci` below aggregates) passes
  # for exactly that commit.
  workflow_call:

# A new push to the same PR/ref cancels the superseded run instead of queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The gate is compile-bound, not test-bound: once built, the test binaries
# together finish in seconds. So the jobs are split by what has to be built,
# not by what is cheapest to name -- clippy and `cargo test` cannot share
# artifacts (clippy drives the workspace through a different wrapper), which the
# old single `check` job paid for twice in a row, serially, in one 14m run.
jobs:
  # Which surfaces a pull request touches, so unaffected heavy jobs skip on PRs
  # instead of burning runner slots. A pull request checks out GitHub's merge
  # commit, whose first parent is the base branch tip, so a depth-2 checkout
  # diffs the whole PR against its base with no API call and no token
  # permission beyond `contents: read` (which matters: release.yml calls this
  # workflow, and a called job cannot ask for more than its caller grants).
  # Pull requests only; every other event runs the full suite unconditionally.
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      build_config: ${{ steps.files.outputs.build_config }}
      rust: ${{ steps.files.outputs.rust }}
      rust_libs: ${{ steps.files.outputs.rust_libs }}
      wasm: ${{ steps.files.outputs.wasm }}
      web_site: ${{ steps.files.outputs.web_site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: files
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
          cat "$RUNNER_TEMP/files"

          emit() {
            local key=$1 pattern=$2
            if grep -qE "$pattern" "$RUNNER_TEMP/files"; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # What decides how the workspace is compiled: the profiles and the
          # dependency graph, the toolchain pin, the cargo config, the CI
          # profile override in rust-env, and the test-verdict wrapper.
          emit build_config '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/config\.toml|\.github/actions/rust-env/action\.yml|\.shots/run-tests\.sh)$'
          emit rust '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|deny\.toml|clippy\.toml|\.cargo/|crates/|gallery/|examples/|\.shots/(lint|run-tests)\.sh$|\.shots/(test-control|control|batch|smoke)\.ps1$|\.github/(workflows/|actions/)|web/src/data/rust-examples\.json$)'
          emit rust_libs '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/|crates/herogpui(-core|-theme|-components)?/|\.github/(workflows/ci\.yml|actions/rust-env/))'
          emit wasm '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/|crates/|gallery/|\.shots/build-wasm\.sh$|web/scripts/gallery-smoke(\.test)?\.mjs$|web/scripts/gallery-artifact\.mjs$|web/scripts/extract-wasm-sections\.mjs$|web/scripts/extract-rust-examples\.mjs$|web/scripts/lib/|web/public/gallery/index\.html$|web/src/data/rust-examples\.json$|\.github/workflows/ci\.yml$)'
          emit web_site '^(web/|crates/|gallery/|examples/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.cargo/config\.toml$|CHANGELOG\.md$|docs/migration-[^/]+\.md$|llms\.txt$|\.shots/build-wasm\.sh$|\.shots/[^/]+-tile(-dark)?-v3\.png$|\.github/(workflows/ci\.yml|actions/))'

  # Everything that needs no Rust build. A formatting or gallery-sync failure
  # reports in under a minute instead of after a full compile.
  web:
    name: Format, gallery sync & website
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.web_site == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Plain `cargo fmt --all -- --check`: the workspace has no patched
      # dependencies and no generated sources, so rustfmt needs nothing
      # materialized first.
      - name: Format check
        if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      # There is no root package.json, so the action has to be told where the
      # pinned "packageManager" lives; without it the step fails outright
      # rather than defaulting to a version.
      - name: Install pnpm
        if: github.event_name != 'pull_request' || needs.changes.outputs.web_site == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Install Node
        if: github.event_name != 'pull_request' || needs.changes.outputs.web_site == 'true'
        uses: actions/setup-node@v7
        with:
          # Production (Vercel) runs Node 24.x; build on the same major.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install website dependencies
        if: github.event_name != 'pull_request' || needs.changes.outputs.web_site == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      # extract:check compares every generated dataset (reference, catalog and
      # versions, Rust snippets, releases from CHANGELOG.md) and the wasm
      # manifest -- example bodies and the artifact key, a hash of every wasm
      # build input -- against the checkout, with no network. That the
      # snippets compile is the `test` job's: gallery/build.rs turns each one
      # into a test-only module of herogpui-gallery.
      - name: Component gallery sync
        if: github.event_name != 'pull_request' || needs.changes.outputs.web_site == 'true'
        working-directory: web
        run: pnpm run extract:check

      # The production build's first step downloads the gallery artifact for
      # this checkout (web/scripts/gallery-artifact.mjs). Here it runs beside
      # the `wasm` job that builds that artifact, so it takes whatever is
      # published without waiting -- the exact build, master's as a fallback,
      # or none -- and never fails for want of one: this job checks the site,
      # the Vercel build is what ships it.
      - name: Website typecheck, lint and production build
        if: github.event_name != 'pull_request' || needs.changes.outputs.web_site == 'true'
        working-directory: web
        env:
          HEROGPUI_GALLERY_WAIT_SECONDS: "0"
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build

  # The parity contract. These read the pinned v3.2.7 bundle checked in at
  # .shots/heroui-bundle.txt.gz, the checked-in CSS archive, and the checked-in
  # ComponentPreview demo archive. A cold runner never fetches upstream; no
  # Rust build is needed. A parity regression and a compile error report
  # separately.
  parity:
    name: HeroUI v3.2.7 parity audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Parity reader regressions
        run: |
          python .shots/test_bundle.py
          python .shots/design_audit.py --self-test
          python .shots/anim_audit.py --self-test
          python .shots/test_interaction_inventory.py
          python .shots/test_parity_report.py
          python .shots/test_coverage_report.py
          python .shots/test_inert.py
          python .shots/test_native_capture.py
          python .shots/stale_docs_audit.py --self-test
          python .shots/demo_audit.py --self-test

      - name: Interaction inventory freshness
        run: python .shots/interaction_inventory.py --check

      - name: Maintainer coverage report freshness
        run: python .shots/coverage_report.py --check

      - name: Lucide icon set freshness
        run: |
          python .shots/sync-lucide.py --self-test
          python .shots/sync-lucide.py --check

      - name: Audit set with strict summary checks
        run: python .shots/parity_report.py --output "$RUNNER_TEMP/parity-report.json"

      - name: Preserve parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-report
          path: ${{ runner.temp }}/parity-report.json
          if-no-files-found: ignore

      # In the aggregate above already; run its self-test separately so a
      # broken *scanner* reports separately from a broken contract. The a11y
      # audit's subject is not in the pinned docs bundle -- it is the React
      # Aria hooks under `web/node_modules` -- so a parser regression there
      # would otherwise look like a clean accessibility tree.
      - name: Accessibility contract scanner
        run: python .shots/a11y_audit.py --self-test

      # Separate from the static audit set: this generator's --check fetches
      # a pinned FontTools through uv. It
      # guards a failure the compiler cannot see -- the embedded font files are
      # subsets keyed to the glyphs the sources actually use, and adding a new
      # string literal silently leaves a glyph with no outline to draw.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Web font subsets
        run: python .shots/subset-fonts.py --check

  lint:
    name: Lints, cargo-deny & no-default-features
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-env

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # Unused-dependency gate. cargo-machete reads every manifest in the
      # tree and greps the crate sources for each dependency's name -- no
      # build, not even a toolchain -- so it answers in seconds and sits
      # before the clippy step below, which pays for a full compile.
      #
      # There is no ignore list today, deliberately: the tree is clean with
      # none (verified against cargo-machete 0.9.2, what install-action
      # currently resolves). If a future dependency genuinely needs one --
      # build.rs-generated code machete cannot see, a renamed import --
      # machete honors `[package.metadata.cargo-machete] ignored = [...]` in
      # that crate's manifest, or the same table under
      # `[workspace.metadata.cargo-machete]` in the root. Every entry must
      # carry its reason in a comment beside it, the way
      # `[package.metadata.cargo-shear]` does upstream; an entry
      # without a reason is a hole in the gate.
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

      # `--require-deny`: cargo-deny is installed above, so a missing binary
      # here means that step broke, and must not read as "skipped, green".
      - name: Lint gate (workspace lints, clippy -D warnings, cargo-deny)
        shell: bash
        run: bash .shots/lint.sh --require-deny

      # A workspace build (clippy above, the tests) compiles each crate with
      # the union of the features its workspace dependents enable; it says
      # nothing about any one feature alone or about `--no-default-features`.
      # `--each-feature` checks every crate both with `--no-default-features`
      # (the way a downstream `default-features = false` edge builds it) and
      # with each feature isolated (including herogpui-components'
      # `gallery-source`).
      - name: Each feature alone & no default features
        run: cargo hack check --workspace --each-feature --locked

  # The test suite runs on all three hosts, not just Linux: the repo is
  # developed against them (`.shots/*.ps1` and the rust-lld linker pin in
  # `.cargo/config.toml` are Windows-first; the maintainer's gallery runs are
  # on macOS and Windows), and linking the gpui platform crates is the one
  # part of the build that differs per OS. `gpui_platform`'s font-kit,
  # wayland and x11 features forward into target-gated crates in the gpui
  # family and are inert off their own targets, so the single dependency spec
  # in the workspace root builds everywhere with no per-OS feature matrix.
  #
  # `lint` and `doc` (plus the gallery CLI source install in `test`) stay
  # Linux-only on purpose: this workspace's own sources carry almost no
  # `cfg(windows)`/`cfg(macos)` branches (the wasm ones in
  # herogpui/herogpui-web, and the two platform readers of
  # herogpui-components' `system_locale.rs`, a few lines each), so clippy and
  # rustdoc analyze essentially identical code on any host, while the
  # OS-sensitive surface -- linking and running the suite, which does compile
  # those readers -- is what this matrix exercises. `unsafe_code = "deny"` is a
  # rustc lint inherited through `[workspace.lints]`, so every matrix leg's
  # build enforces it on its own host even without clippy.
  #
  # On standard PRs, `sweep_shard_` (`gallery`'s headless `TestAppContext`
  # interaction sweep, ~145s at -O0) runs in full on Linux and is skipped on
  # macOS and Windows so those legs finish in ~3 minutes instead of ~6–7m.
  # Pushes to master, release tags, `build_config` changes, and `ci:opt-levels`
  # PRs still run the full suite on all three hosts.
  test:
    name: Tests
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.rust == 'true')
    strategy:
      # Which OS broke is exactly the information this matrix exists to
      # surface, and it is invisible when the surviving legs are cancelled at
      # the first failure.
      fail-fast: false
      matrix:
        # rust-cache's key embeds the rustc host triple, so the three legs
        # keep separate caches without a per-leg `key` here.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-env

      - name: Workspace tests
        env:
          SKIP_SWEEP: >-
            ${{
              runner.os != 'Linux' &&
              github.event_name == 'pull_request' &&
              !contains(github.event.pull_request.labels.*.name, 'ci:opt-levels') &&
              needs.changes.outputs.build_config != 'true'
            }}
        # `.shots/run-tests.sh` wraps `cargo test`; a bare invocation reads
        # the process exit code alone, which cannot be trusted either
        # direction on this workspace — a killed binary with no summary line
        # would read as green, and a run whose every test passed has still
        # exited non-zero. The script judges the harness's own
        # `test result:` lines instead.
        #
        # `shell: bash` is explicit because a `run:` step's default on a
        # Windows runner is pwsh; the script is bash (its header says why)
        # and git-bash ships on every GitHub Windows runner.
        shell: bash
        run: |
          if [ "$SKIP_SWEEP" = true ]; then
            bash .shots/run-tests.sh --workspace --locked -- --skip sweep_shard_
          else
            bash .shots/run-tests.sh --workspace --locked
          fi

      - name: Windows gallery control protocol
        if: runner.os == 'Windows'
        shell: pwsh
        run: .shots/test-control.ps1

      # The workspace run above uses default features. `serde` is off by
      # default on purpose, so its unit tests would otherwise never run.
      - name: Theme serde feature tests
        shell: bash
        run: bash .shots/run-tests.sh -p herogpui-theme --features serde --locked

      # `cargo install --path` is the contributor's route to the gallery CLI (the
      # registry route, `cargo install herogpui-gallery`, is exercised at release
      # time); this proves the workspace installs from a checkout with `--locked`.
      # Run on the Linux test leg so it reuses the warm `target/` instead of
      # paying for another runner and 900 MB cache restore.
      - name: Install the gallery CLI from source
        if: runner.os == 'Linux'
        shell: bash
        run: cargo install --path gallery --locked --debug --force --target-dir target

  doc:
    name: Rustdoc
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-env

      - name: Rustdoc
        env:
          # `--cfg docsrs` matches the flag docs.rs itself builds with (see
          # each crate's `[package.metadata.docs.rs]`), so a `#[cfg(docsrs)]`
          # doc-only item and any docsrs-gated intra-doc link are exercised
          # here instead of surfacing for the first time on the published
          # docs.rs page.
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --workspace --no-deps --locked

  # What the -O0 workspace gives up, this takes back. `test` builds the workspace
  # crates unoptimized; nothing else in the pipeline then compiles them the way a
  # developer's `cargo test` does, and this repo has already shown that a
  # codegen flag can change what a layout assertion reports. So every merged
  # commit gets the Cargo.toml profile here, off the PR critical path where its
  # length costs nobody a review cycle.
  #
  # On a pull request it is opt-in, so an optimisation-level regression can be
  # caught before merge instead of first showing on master or at tag time: add
  # the `ci:opt-levels` label (layout, geometry or timing work is the usual
  # reason), or touch a build-configuration file (`changes` above), which
  # changes codegen for everything and so always runs it.
  optimized:
    name: Tests (Cargo.toml profile)
    needs: [changes]
    # `!cancelled()` because `changes` is skipped on every non-PR event, and a
    # skipped need would otherwise skip this job on exactly the events it
    # always runs for.
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && (
          contains(github.event.pull_request.labels.*.name, 'ci:opt-levels') ||
          needs.changes.outputs.build_config == 'true')))
    # The same three hosts as `test` for the same reasons (see that job's
    # comment). Codegen is per-platform as well as per-opt-level, so the
    # -O1/-O3 suite owes each OS its own run. Opt-in on pull requests keeps
    # the three heavy legs off the PR critical path by default.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-env
        with:
          profile: real

      - name: Workspace tests at -O1/-O3
        # Same reasoning as the `test` job's step: a bare `cargo test` exit
        # code cannot be trusted in either direction here, so this run is
        # judged by .shots/run-tests.sh reading the harness's own summary.
        # `shell: bash` for the same reason as there.
        shell: bash
        run: bash .shots/run-tests.sh --workspace --locked

      - name: Theme serde feature tests at -O1/-O3
        shell: bash
        run: bash .shots/run-tests.sh -p herogpui-theme --features serde --locked

  # The web gallery is built from this workspace now, not from a second
  # checkout: `crates/herogpui-web` is a workspace member that links the
  # `herogpui-gallery` library and compiles for wasm32. So a PR that breaks the
  # web build fails here, before merge.
  #
  # This job is also where the website's artifact comes from. The ~19 MB
  # binary is not committed: `.shots/build-wasm.sh` builds, binds, optimises
  # and stamps it, and `wasm-publish` publishes trusted master builds as a
  # `gallery-<key16>` prerelease keyed by the hash of every wasm build input, which the Vercel
  # build (`web/scripts/gallery-artifact.mjs fetch`) downloads for its own
  # checkout. See web/DEPLOYMENT.md, section 6.
  #
  # It builds rather than checks: `wasm-bindgen` is the step that actually
  # rejects a bad `#[wasm_bindgen]` surface, and it needs a real .wasm.
  wasm:
    name: Build (wasm32)
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.wasm == 'true')
    runs-on: ubuntu-24.04
    env:
      # binaryen's wasm-opt, pinned by version and archive digest (the
      # version is also checked by .shots/build-wasm.sh).
      BINARYEN_VERSION: "133"
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Like every other job, this one builds on `rust-toolchain.toml`'s
      # pinned stable: `rustup toolchain install` reads that file when given
      # no toolchain name. That became possible with gpui-pre 0.3.10: its
      # `gpui_platform` forwards `gpui_web`'s `multithreaded` default instead
      # of forcing it (zed#65289), and this workspace sets
      # `default-features = false` on the `gpui_platform` edge, so
      # `wasm_thread` — the `#![feature]` crate that made the wasm32 build
      # nightly-only — stays out of the graph. The facade's opt-in
      # `multithreaded` feature can still pull it back, but it also needs a
      # nightly toolchain and cross-origin isolation (COOP/COEP) the site
      # does not send, and nothing enables it here or in `herogpui-web`,
      # which starts `single_threaded_web()` — see
      # docs/upstream/gpui-web-multithreaded.md.
      - name: Install the pinned toolchain's wasm32 target
        run: |
          rustup toolchain install --profile minimal --component rustc,cargo,rust-std
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      # `wasm-bindgen` output is version-sensitive in both directions: the
      # crate compiled into the artifact and the CLI that post-processes it
      # emit and consume a shared, unstable descriptor format. A mismatch
      # fails with a schema-version error that names neither the lockfile nor
      # the installed CLI, so the version is read out of Cargo.lock rather
      # than written down twice, and installed as a prebuilt binary (~2s vs
      # ~72s compiling from source).
      - name: Read wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          set -euo pipefail
          version=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d '"' -f 2)
          echo "wasm-bindgen from Cargo.lock: $version"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli pinned to Cargo.lock
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      - name: Install binaryen (wasm-opt) ${{ env.BINARYEN_VERSION }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      # The stamp step (web/scripts/gallery-artifact.mjs) is plain Node with
      # no dependencies; the same major as the website build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No `RUSTFLAGS` here, deliberately. `.cargo/config.toml`'s
      # `[target.wasm32-unknown-unknown]` table sets `rustflags = []`, and a
      # `RUSTFLAGS` environment variable *replaces* a config file's rustflags
      # rather than appending to them; .shots/build-wasm.sh refuses to run
      # with it set. The script is the same recipe a developer runs locally:
      # wasm32 build on the pinned stable toolchain, wasm-bindgen, wasm-opt,
      # then build-info.json.
      - name: Build, bind, optimise and stamp the web gallery
        run: bash .shots/build-wasm.sh --out "$RUNNER_TEMP/gallery" --source ci

      - name: Hand the artifact to wasm-publish on master
        uses: actions/upload-artifact@v7
        with:
          name: web-gallery
          path: ${{ runner.temp }}/gallery/
          retention-days: 7
          if-no-files-found: error

  wasm-smoke:
    name: Web gallery smoke (headless Chrome)
    needs: [wasm]
    # `!cancelled() && needs.wasm.result == 'success'` because `wasm` depends
    # on `changes`, which skips on every non-PR event; without a status
    # function here, GitHub Actions' implicit `success()` sees the skipped
    # `changes` ancestor and skips `wasm-smoke` too.
    if: "!cancelled() && needs.wasm.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: web-gallery
          path: ${{ runner.temp }}/gallery

      - name: Use the site's host page
        run: cp web/public/gallery/index.html "$RUNNER_TEMP/gallery/index.html"

      - name: Render every example and drive the browser input paths
        run: >-
          node web/scripts/gallery-smoke.mjs
          --dir "$RUNNER_TEMP/gallery"
          --workers 4
          --record "$RUNNER_TEMP/wasm-smoke.json"
          --shots "$RUNNER_TEMP/shots"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-smoke
          path: |
            ${{ runner.temp }}/wasm-smoke.json
            ${{ runner.temp }}/shots/
          retention-days: 7
          if-no-files-found: warn

  # Publishes what `wasm` built as its `gallery-<key16>` prerelease (a draft
  # until every asset is attached, so immutable releases are fine). A
  # separate job so the write token never shares a runner with the build: the
  # wasm job compiles third-party build scripts, this one runs only gh and jq.
  # Pull requests have no write token: their checkout can change scripts and
  # workflows. Previews use master's last trusted artifact instead. On a
  # master push the job also marks the key's release
  # `[master <time>]` (the preview fallback; a title edit, which immutable
  # releases allow) and deletes old gallery releases.
  wasm-publish:
    name: Publish web gallery artifact
    needs: [wasm]
    # Same `!cancelled() && needs.wasm.result == 'success'` guard as `wasm-smoke` above.
    if: >-
      !cancelled() &&
      needs.wasm.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .shots/publish-gallery.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: web-gallery
          path: ${{ runner.temp }}/gallery

      - name: Publish the gallery-<key16> release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .shots/publish-gallery.sh "$RUNNER_TEMP/gallery" --master

  # The published library crates' public API against their latest crates.io
  # release (whatever that is when the job runs: no baseline version is
  # written down here to go stale). cargo-semver-checks derives the allowed
  # change from the manifest version: while `[workspace.package].version`
  # still equals the released one it assumes a non-breaking release and fails
  # a breaking change; once the release PR bumps the version (0.x minor, or
  # major), breaking changes pass. Work that deliberately breaks the API ahead
  # of that bump carries the `semver:breaking` label, which passes
  # `--release-type major` -- the label is the reviewer's acknowledgement, and
  # the break still needs its CHANGELOG and migration notes.
  #
  # On pull requests, skips when no library crate or manifest changed. Also
  # runs on pushes to master with `--release-type major` so `master` keeps a
  # warm `target/semver-checks` cache (cutting PR cold-cache runs from ~7m to
  # ~30-60s) without failing when a `semver:breaking` PR merges ahead of a
  # release version bump. On tag pushes the release workflow runs its own
  # `semver` job before publishing.
  semver:
    name: SemVer (cargo-semver-checks)
    needs: [changes]
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.rust_libs == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Linux system libraries: the rustdoc JSON build of `herogpui` compiles
      # the GPUI platform crates' build scripts like any other build.
      - uses: ./.github/actions/rust-env

      # Pinned, unlike the lint tools: cargo-semver-checks reads rustdoc JSON,
      # whose format changes with rustc, so a floating version can break the
      # job on a toolchain it does not support. Bump it with the toolchain.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Public API against the latest crates.io release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BREAKING_OK: ${{ contains(github.event.pull_request.labels.*.name, 'semver:breaking') }}
        run: |
          set -euo pipefail
          args=(-p herogpui-core -p herogpui-theme -p herogpui-components -p herogpui)
          if [ "$EVENT_NAME" = "push" ] || [ "$BREAKING_OK" = true ]; then
            echo "accepting breaking changes (event=$EVENT_NAME, semver:breaking=$BREAKING_OK)"
            args+=(--release-type major)
          fi
          cargo semver-checks "${args[@]}"

  # No MSRV job, deliberately: `rust-version` (1.99) is the same release as
  # `rust-toolchain.toml`'s pin (1.99.1), so every job above already builds
  # on the MSRV and a separate job would repeat `test`. `package_audit.py`
  # (in `parity`) fails if the two -- or clippy.toml's `msrv` -- ever differ,
  # which is the point at which a real MSRV job is needed.

  # The one status branch protection should point at. Adding a job to this
  # workflow means adding its name to `needs` below; a job left out of that
  # list fails silently — branch protection just never learns it exists — so
  # this jq check is the one place a missed job fails loudly, in review, on
  # the PR that added it. On pull requests `changes` filters unaffected jobs
  # (`web`, `lint`, `test`, `doc`, `wasm` and its downstream `wasm-smoke`,
  # `semver`), `optimized` is opt-in, and `wasm-publish` skips; off pull
  # requests `changes` and `wasm-publish` (off `master`) skip. Elsewhere
  # `skipped` passes, while `decide` enforces that `wasm-smoke` succeeds when
  # `wasm` does and that `wasm` + `wasm-publish` succeed on `master` pushes.
  ci:
    name: ci
    if: always()
    needs: [web, parity, lint, test, doc, changes, optimized, semver, wasm, wasm-smoke, wasm-publish]
    runs-on: ubuntu-24.04
    steps:
      - name: decide
        env:
          RESULTS: ${{ toJson(needs) }}
          IS_MASTER_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --argjson master "$IS_MASTER_PUSH" '
            all(.[] | .result; . == "success" or . == "skipped") and
            (.wasm.result != "success" or ."wasm-smoke".result == "success") and
            (($master | not) or (.wasm.result == "success" and ."wasm-publish".result == "success"))
          '
