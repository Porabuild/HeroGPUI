name: CI

on:
  pull_request:
    # `labeled`/`unlabeled` on top of the defaults so the two opt-in labels
    # take effect when they are added or removed, not on the next push:
    # `ci:opt-levels` runs the `optimized` suite on the pull request, and
    # `semver:breaking` lets the `semver` job accept a breaking change (see
    # both jobs). Any label change re-runs the workflow; `concurrency` below
    # cancels the run it supersedes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
  workflow_dispatch:
  # release.yml calls this whole workflow on the tagged commit, so nothing is
  # published unless the full gate (every job `ci` below aggregates) passes
  # for exactly that commit.
  workflow_call:

# A new push to the same PR/ref cancels the superseded run instead of queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The gate is compile-bound, not test-bound: once built, the whole suite (every
# test binary `cargo test` announces) finishes in seconds. So the jobs are split
# by what has to be built, not by what is cheapest to name -- clippy and `cargo
# test` cannot share artifacts (clippy drives the workspace through a different
# wrapper), which the old single `check` job paid for twice in a row, serially,
# in one 14m run.
jobs:
  # Everything that needs no Rust build. A formatting or gallery-sync failure
  # reports in under a minute instead of after a full compile.
  web:
    name: Format, gallery sync & website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # There is no root package.json, so the action has to be told where the
      # pinned "packageManager" lives; without it the step fails outright
      # rather than defaulting to a version.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Production (Vercel) runs Node 24.x; build on the same major.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Plain `cargo fmt --all -- --check`: the workspace has no patched
      # dependencies and no generated sources, so rustfmt needs nothing
      # materialized first.
      - name: Format check
        run: cargo fmt --all -- --check

      # extract:check compares every generated dataset (reference, catalog and
      # versions, Rust snippets, releases from CHANGELOG.md) and the wasm
      # manifest -- artifact bytes, example bodies and a hash of every wasm
      # build input -- against the checkout, with no network. That the
      # snippets compile is the `test` job's: gallery/build.rs turns each one
      # into a test-only module of herogpui-gallery.
      - name: Component gallery sync
        working-directory: web
        run: pnpm run extract:check

      - name: Website typecheck, lint and production build
        working-directory: web
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run build

  # The parity contract. These read the pinned v3.2.6 bundle checked in at
  # .shots/heroui-bundle.txt.gz, the checked-in CSS archive, and the checked-in
  # ComponentPreview demo archive. A cold runner never fetches upstream; no
  # Rust build is needed. A parity regression and a compile error report
  # separately.
  parity:
    name: HeroUI v3.2.6 parity audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parity reader regressions
        run: |
          python .shots/test_bundle.py
          python .shots/design_audit.py --self-test
          python .shots/test_interaction_inventory.py
          python .shots/test_parity_report.py
          python .shots/test_coverage_report.py
          python .shots/test_inert.py
          python .shots/test_native_capture.py
          python .shots/stale_docs_audit.py --self-test
          python .shots/demo_audit.py --self-test

      - name: Interaction inventory freshness
        run: python .shots/interaction_inventory.py --check

      - name: Maintainer coverage report freshness
        run: python .shots/coverage_report.py --check

      - name: Lucide icon set freshness
        run: |
          python .shots/sync-lucide.py --self-test
          python .shots/sync-lucide.py --check

      - name: Audit set with strict summary checks
        run: python .shots/parity_report.py --output "$RUNNER_TEMP/parity-report.json"

      - name: Preserve parity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parity-report
          path: ${{ runner.temp }}/parity-report.json
          if-no-files-found: ignore

      # In the aggregate above already; run its self-test separately so a
      # broken *scanner* reports separately from a broken contract. The a11y
      # audit's subject is not in the pinned docs bundle -- it is the React
      # Aria hooks under `web/node_modules` -- so a parser regression there
      # would otherwise look like a clean accessibility tree.
      - name: Accessibility contract scanner
        run: python .shots/a11y_audit.py --self-test

      # Separate from the static audit set: this generator's --check fetches
      # a pinned FontTools through uv. It
      # guards a failure the compiler cannot see -- the embedded font files are
      # subsets keyed to the glyphs the sources actually use, and adding a new
      # string literal silently leaves a glyph with no outline to draw.
      - uses: astral-sh/setup-uv@v5

      - name: Web font subsets
        run: python .shots/subset-fonts.py --check

  lint:
    name: Lints & cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # Unused-dependency gate. cargo-machete reads every manifest in the
      # tree and greps the crate sources for each dependency's name -- no
      # build, not even a toolchain -- so it answers in seconds and sits
      # before the clippy step below, which pays for a full compile.
      #
      # There is no ignore list today, deliberately: the tree is clean with
      # none (verified against cargo-machete 0.9.2, what install-action
      # currently resolves). If a future dependency genuinely needs one --
      # build.rs-generated code machete cannot see, a renamed import --
      # machete honors `[package.metadata.cargo-machete] ignored = [...]` in
      # that crate's manifest, or the same table under
      # `[workspace.metadata.cargo-machete]` in the root. Every entry must
      # carry its reason in a comment beside it, the way
      # `[package.metadata.cargo-shear]` does upstream; an entry
      # without a reason is a hole in the gate.
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

      # `--require-deny`: cargo-deny is installed above, so a missing binary
      # here means that step broke, and must not read as "skipped, green".
      - name: Lint gate (workspace lints, clippy -D warnings, cargo-deny)
        shell: bash
        run: bash .shots/lint.sh --require-deny

      # A workspace build (clippy above, the tests) compiles each crate with
      # the union of the features its workspace dependents enable; it says
      # nothing about any one feature alone. herogpui-components'
      # `gallery-source` is the case that matters here: `--each-feature` builds
      # it by itself, with no other feature unifying in dependencies it might
      # otherwise lean on.
      - name: Each feature alone
        run: cargo hack check --workspace --each-feature --locked

  # The test suite runs on all three hosts, not just Linux: the repo is
  # developed against them (`.shots/*.ps1` and the rust-lld linker pin in
  # `.cargo/config.toml` are Windows-first; the maintainer's gallery runs are
  # on macOS and Windows), and linking the gpui platform crates is the one
  # part of the build that differs per OS. `gpui_platform`'s font-kit,
  # wayland and x11 features forward into target-gated crates in the gpui
  # family and are inert off their own targets, so the single dependency spec
  # in the workspace root builds everywhere with no per-OS feature matrix.
  #
  # `lint`, `doc` and `install` stay Linux-only on purpose: this workspace's
  # own sources carry almost no `cfg(windows)`/`cfg(macos)` branches (the wasm
  # ones in herogpui/herogpui-web, and the two platform readers of
  # herogpui-components' `system_locale.rs`, a few lines each), so clippy and
  # rustdoc analyze essentially identical code on any host, while the
  # OS-sensitive surface -- linking and running the suite, which does compile
  # those readers -- is what this matrix exercises. `unsafe_code = "deny"` is a
  # rustc lint inherited through `[workspace.lints]`, so every matrix leg's
  # build enforces it on its own host even without clippy.
  test:
    name: Tests
    strategy:
      # Which OS broke is exactly the information this matrix exists to
      # surface, and it is invisible when the surviving legs are cancelled at
      # the first failure.
      fail-fast: false
      matrix:
        # rust-cache's key embeds the rustc host triple, so the three legs
        # keep separate caches without a per-leg `key` here.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      - name: Workspace tests
        # `.shots/run-tests.sh` wraps `cargo test`; a bare invocation reads
        # the process exit code alone, which cannot be trusted either
        # direction on this workspace — a killed binary with no summary line
        # would read as green, and a run whose every test passed has still
        # exited non-zero. The script judges the harness's own
        # `test result:` lines instead.
        #
        # `shell: bash` is explicit because a `run:` step's default on a
        # Windows runner is pwsh; the script is bash (its header says why)
        # and git-bash ships on every GitHub Windows runner.
        shell: bash
        run: bash .shots/run-tests.sh --workspace --locked

      - name: Windows gallery control protocol
        if: runner.os == 'Windows'
        shell: pwsh
        run: .shots/test-control.ps1

      # The workspace run above uses default features. `serde` is off by
      # default on purpose, so its unit tests would otherwise never run.
      - name: Theme serde feature tests
        shell: bash
        run: bash .shots/run-tests.sh -p herogpui-theme --features serde --locked

  doc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      - name: Rustdoc
        env:
          # `--cfg docsrs` matches the flag docs.rs itself builds with (see
          # each crate's `[package.metadata.docs.rs]`), so a `#[cfg(docsrs)]`
          # doc-only item and any docsrs-gated intra-doc link are exercised
          # here instead of surfacing for the first time on the published
          # docs.rs page.
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --workspace --no-deps --locked

  # `cargo install --path` is the contributor's route to the gallery CLI (the
  # registry route, `cargo install herogpui-gallery`, is exercised at release
  # time); this proves the workspace installs from a checkout with `--locked`.
  install:
    name: Source install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      - name: Install the gallery CLI from source
        # `cargo install` builds into a throwaway directory unless it is told
        # otherwise, so there was nothing for the job's cache to hold and this
        # step rebuilt all 486 crates from scratch in 694s. Writing into the
        # workspace `target/` makes the step cacheable: 14s once it is warm.
        run: cargo install --path gallery --locked --debug --force --target-dir target

  # Which build-configuration files a pull request touches, for `optimized`
  # below. A pull request checks out GitHub's merge commit, whose first parent
  # is the base branch tip, so a depth-2 checkout diffs the whole PR against
  # its base with no API call and no token permission beyond `contents: read`
  # (which matters: release.yml calls this workflow, and a called job cannot
  # ask for more than its caller grants). Pull requests only; every other
  # event runs `optimized` unconditionally.
  changes:
    name: Changed build configuration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      build_config: ${{ steps.files.outputs.build_config }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: files
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
          cat "$RUNNER_TEMP/files"
          # What decides how the workspace is compiled: the profiles and the
          # dependency graph, the toolchain pin, the cargo config, the CI
          # profile override in rust-env, and the test-verdict wrapper.
          if grep -qxE 'Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/config\.toml|\.github/actions/rust-env/action\.yml|\.shots/run-tests\.sh' "$RUNNER_TEMP/files"; then
            echo "build_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_config=false" >> "$GITHUB_OUTPUT"
          fi

  # What the -O0 workspace gives up, this takes back. `test` builds the workspace
  # crates unoptimized; nothing else in the pipeline then compiles them the way a
  # developer's `cargo test` does, and this repo has already shown that a
  # codegen flag can change what a layout assertion reports. So every merged
  # commit gets the Cargo.toml profile here, off the PR critical path where its
  # length costs nobody a review cycle.
  #
  # On a pull request it is opt-in, so an optimisation-level regression can be
  # caught before merge instead of first showing on master or at tag time: add
  # the `ci:opt-levels` label (layout, geometry or timing work is the usual
  # reason), or touch a build-configuration file (`changes` above), which
  # changes codegen for everything and so always runs it.
  optimized:
    name: Tests (Cargo.toml profile)
    needs: [changes]
    # `!cancelled()` because `changes` is skipped on every non-PR event, and a
    # skipped need would otherwise skip this job on exactly the events it
    # always runs for.
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && (
          contains(github.event.pull_request.labels.*.name, 'ci:opt-levels') ||
          needs.changes.outputs.build_config == 'true')))
    # The same three hosts as `test` for the same reasons (see that job's
    # comment). Codegen is per-platform as well as per-opt-level, so the
    # -O1/-O3 suite owes each OS its own run. Opt-in on pull requests keeps
    # the three heavy legs off the PR critical path by default.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env
        with:
          profile: real

      - name: Workspace tests at -O1/-O3
        # Same reasoning as the `test` job's step: a bare `cargo test` exit
        # code cannot be trusted in either direction here, so this run is
        # judged by .shots/run-tests.sh reading the harness's own summary.
        # `shell: bash` for the same reason as there.
        shell: bash
        run: bash .shots/run-tests.sh --workspace --locked

      - name: Theme serde feature tests at -O1/-O3
        shell: bash
        run: bash .shots/run-tests.sh -p herogpui-theme --features serde --locked

  # The web gallery is built from this workspace now, not from a second
  # checkout: `crates/herogpui-web` is a workspace member that links the
  # `herogpui-gallery` library and compiles for wasm32. So a PR that breaks the
  # web build has to fail here, before merge, rather than the next time someone
  # regenerates the checked-in artifact by hand.
  #
  # This builds rather than checks. `wasm-bindgen` is the step that actually
  # rejects a bad `#[wasm_bindgen]` surface, and it needs a real .wasm; a
  # `cargo check` would pass on inputs it cannot process.
  wasm:
    name: Build (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # The one job that does not build on `rust-toolchain.toml`'s pinned
      # stable: it installs nightly with the wasm32 target below and passes
      # `+nightly` explicitly. This job is the one place a nightly toolchain is
      # allowed, and the reason is upstream's, not ours: vanilla `gpui-pre-web` enables its
      # `multithreaded` feature by default, which pulls in `wasm_thread`,
      # whose lib.rs opens with `#![feature]` — so a stable build of this
      # target fails outright with `error[E0554]`. The only stable-compatible
      # switch would be a forked web-platform manifest (cargo unions feature
      # sets, so no downstream edge can turn the default off), and the fork
      # is retired — see `docs/upstream/retired-patches/`. Nothing in the
      # gallery uses the multi-threaded platform: `crates/herogpui-web`
      # starts the app with `single_threaded_web()`, and web workers need
      # cross-origin isolation the Vercel-hosted site does not provide. If a
      # future `gpui-pre-web` drops the default, move this job back to the
      # pinned stable toolchain and delete the `+nightly` below.
      - name: Install nightly with the wasm32 target
        run: |
          rustup toolchain install nightly --profile minimal --component rustc,cargo,rust-std -t wasm32-unknown-unknown
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-nightly

      # `wasm-bindgen` output is version-sensitive in both directions: the
      # crate compiled into the artifact and the CLI that post-processes it
      # emit and consume a shared, unstable descriptor format. A mismatch
      # fails with a schema-version error that names neither the lockfile nor
      # the installed CLI, so the version is read out of Cargo.lock rather
      # than written down twice.
      - name: Install wasm-bindgen-cli pinned to Cargo.lock
        run: |
          set -euo pipefail
          version=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d '"' -f 2)
          echo "wasm-bindgen from Cargo.lock: $version"
          test -n "$version"
          cargo install -f wasm-bindgen-cli --version "$version"

      # No `RUSTFLAGS` here, deliberately. `.cargo/config.toml`'s
      # `[target.wasm32-unknown-unknown]` table sets `rustflags = []` (the
      # shared-memory build was abandoned for `single_threaded_web()` under
      # the Vercel-hosted site, which sends no COOP/COEP headers), and a
      # `RUSTFLAGS` environment variable *replaces* a config file's rustflags
      # rather than appending to them. Setting it here — even to the same
      # value — would silently diverge from that table the moment either side
      # changed. `+nightly` matches the toolchain installed above; everything
      # else in the workspace stays on the pinned stable.
      - name: Build the web gallery
        run: cargo +nightly build --locked --target wasm32-unknown-unknown --profile wasm-release -p herogpui-web

      # The bindgen pass is the check, not a packaging convenience: it is what
      # validates the generated glue against the artifact. The output is
      # thrown away — `web/public/gallery/` holds the committed artifact and
      # this job does not touch it.
      - name: Generate bindings
        run: |
          set -euo pipefail
          wasm-bindgen --target web --no-typescript \
            --out-dir "$RUNNER_TEMP/wasm-bindgen-out" \
            target/wasm32-unknown-unknown/wasm-release/herogpui_web.wasm
          ls -l "$RUNNER_TEMP/wasm-bindgen-out"

  # The published library crates' public API against their latest crates.io
  # release (whatever that is when the job runs: no baseline version is
  # written down here to go stale). cargo-semver-checks derives the allowed
  # change from the manifest version: while `[workspace.package].version`
  # still equals the released one it assumes a non-breaking release and fails
  # a breaking change; once the release PR bumps the version (0.x minor, or
  # major), breaking changes pass. Work that deliberately breaks the API ahead
  # of that bump carries the `semver:breaking` label, which passes
  # `--release-type major` -- the label is the reviewer's acknowledgement, and
  # the break still needs its CHANGELOG and migration notes.
  #
  # Pull requests only. On a push the version question was settled by the
  # PR, and the release workflow runs the same check against the tag before
  # anything is published.
  semver:
    name: SemVer (cargo-semver-checks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Linux system libraries: the rustdoc JSON build of `herogpui` compiles
      # the GPUI platform crates' build scripts like any other build.
      - uses: ./.github/actions/rust-env

      # Pinned, unlike the lint tools: cargo-semver-checks reads rustdoc JSON,
      # whose format changes with rustc, so a floating version can break the
      # job on a toolchain it does not support. Bump it with the toolchain.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Public API against the latest crates.io release
        env:
          BREAKING_OK: ${{ contains(github.event.pull_request.labels.*.name, 'semver:breaking') }}
        run: |
          set -euo pipefail
          args=(-p herogpui-core -p herogpui-theme -p herogpui-components -p herogpui)
          if [ "$BREAKING_OK" = true ]; then
            echo "semver:breaking label present: breaking changes are accepted"
            args+=(--release-type major)
          fi
          cargo semver-checks "${args[@]}"

  # Each published library crate on its own with no default features, the
  # way a downstream `default-features = false` edge builds it. cargo-hack's
  # `--each-feature` in `lint` includes this configuration inside a sweep of
  # every feature; this job names the contract (`package_audit.py` requires
  # the facade's layers to be optional "so --no-default-features compiles")
  # and reports it per crate. One job with a step per crate rather than a
  # matrix: the four builds share one dependency cache instead of four
  # runners each compiling GPUI.
  no-default-features:
    name: No default features
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      - name: herogpui-core
        run: cargo check -p herogpui-core --no-default-features --locked

      - name: herogpui-theme
        run: cargo check -p herogpui-theme --no-default-features --locked

      - name: herogpui-components
        run: cargo check -p herogpui-components --no-default-features --locked

      - name: herogpui
        run: cargo check -p herogpui --no-default-features --locked

  # No MSRV job, deliberately: `rust-version` (1.98) is the same release as
  # `rust-toolchain.toml`'s pin (1.98.0), so every job above already builds
  # on the MSRV and a separate job would repeat `test`. `package_audit.py`
  # (in `parity`) fails if the two -- or clippy.toml's `msrv` -- ever differ,
  # which is the point at which a real MSRV job is needed.

  # The one status branch protection should point at. Adding a job to this
  # workflow means adding its name to `needs` below; a job left out of that
  # list fails silently — branch protection just never learns it exists — so
  # this jq check is the one place a missed job fails loudly, in review, on
  # the PR that added it. `changes` and `semver` run on pull requests only and
  # `optimized` is opt-in there, so `skipped` counts as passing.
  ci:
    name: ci
    if: always()
    needs: [web, parity, lint, test, doc, install, changes, optimized, semver, no-default-features, wasm]
    runs-on: ubuntu-24.04
    steps:
      - name: decide
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[] | .result; . == "success" or . == "skipped")'
