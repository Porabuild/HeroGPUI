name: CI

on:
  pull_request:
  push:
    branches: [main, v3-parity]

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - shell: pwsh
        run: .shots/lint.ps1
      - name: Fetch pinned parity inputs
        shell: pwsh
        run: |
          Invoke-WebRequest https://heroui.com/react/llms-full.txt -OutFile (Join-Path $env:TEMP heroui-full.txt)
          python .shots/design_audit.py --fetch
          python .shots/demo_audit.py --fetch
      - shell: pwsh
        run: |
          Get-ChildItem .shots/*audit.py | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: cargo package -p herogpui-core --allow-dirty --no-verify --list
      - run: cargo package -p herogpui-theme --allow-dirty --no-verify --list
      - run: cargo package -p herogpui-components --allow-dirty --no-verify --list
      - run: cargo package -p herogpui --allow-dirty --no-verify --list
      - run: cargo package -p herogpui-gallery --allow-dirty --no-verify --list
      - run: cargo publish --workspace --dry-run --allow-dirty --locked --no-verify
      - name: Install gallery CLI through Cargo
        shell: pwsh
        run: |
          cargo install --path gallery --locked --debug --root target/install-smoke
          if (-not (Test-Path target/install-smoke/bin/herogpui-gallery.exe)) { exit 1 }

  rust-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libvulkan-dev libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev libfreetype-dev
      - run: cargo test --workspace --locked
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  rust-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libvulkan-dev libwayland-dev libxkbcommon-dev libx11-dev libxcb1-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev libfreetype-dev
      - run: cargo test --workspace --locked

  rust-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --workspace --locked

  npm-launcher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
