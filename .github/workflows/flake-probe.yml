name: flake-probe

# TEMPORARY diagnostic, not a gate. Delete with its PR.
#
# The gate wants the workspace crates at -O0 (221s for `test` against 842s at the
# Cargo.toml profile). The obvious move -- unoptimize everything -- is not safe
# here: layout assertions in dropdown_viewport_deep fail 40/40 with dependencies
# at -O0. A height-capped panel is laid out twice per frame by the positioner
# (once at `MaxContent` to pick a side, once at the cap) and `debug_bounds`
# reports whichever pass wrote last, so its height lands one pixel either side
# depending on codegen. Origin never moves, so this is upstream codegen, not a
# positioning bug -- but it is enough to turn a gate red, and loosening two exact
# assertions to absorb it is loosening the gate for a build flag.
#
# So: dependencies stay at Cargo.toml's -O3 (which is what a developer builds,
# and they are cached, so they cost a PR nothing) and only the workspace drops to
# -O0. This checks that claim in the regime where -O0 dependencies failed every
# single time: one binary, one thread, 40 runs.

on:
  push:
    branches: [poracode/tidy-meadow-2d08ef3f]

permissions:
  contents: read

concurrency:
  group: flake-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: settle rate with deps -O3 / workspace -O0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      # The override has to be visible in the flags, or a silent no-op would
      # report 0/40 and I would read that as good news. One verbose build, and
      # each crate's own rustc command line answers for it -- `taffy` is not a
      # workspace member, so `cargo build -p taffy` is not available here.
      # `tr -d '"'` because cargo -v quotes every argument separately
      # ("--crate-name" "herogpui_core"), and every grep is guarded because this
      # shell runs with -e: a no-match here must not end the job.
      - name: Show what the profile resolved to
        shell: bash
        run: |
          set -uo pipefail
          echo "--- gate config:"
          cat "${CARGO_HOME:-$HOME/.cargo}/config.toml"
          echo "--- Cargo.toml still pins dependencies at -O3:"
          grep -A1 'profile.dev.package' Cargo.toml
          cargo clean
          cargo build --locked --workspace -v > build.log 2>&1 || true
          tr -d '"' < build.log > build.flat
          echo "--- workspace crate (expect opt-level=0):"
          grep -- '--crate-name herogpui_core' build.flat | grep -o 'opt-level=[0-9]*' | sort -u || echo "NO MATCH"
          echo "--- dependency (expect opt-level=3):"
          grep -- '--crate-name taffy' build.flat | grep -o 'opt-level=[0-9]*' | sort -u || echo "NO MATCH"
          rm -f build.log build.flat

      - name: Count settle failures over 40 runs (workspace -O0, deps -O3)
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for i in $(seq 1 40); do
            if ! cargo test --locked -p herogpui-components \
                 --test dropdown_viewport_deep -- --test-threads=1 > "run-$i.log" 2>&1; then
              fail=$((fail + 1))
              echo "--- run $i failed"
              grep -E 'panicked at|left:|right:|FAILED' "run-$i.log" | head -6 || true
            fi
            rm -f "run-$i.log"
          done
          echo "::notice::settle failures with deps -O3 / workspace -O0: $fail / 40"

      - name: Full workspace suite at the gate profile, twice
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2; do
            echo "=== pass $i"
            cargo test --workspace --locked 2>&1 | grep -E 'test result: FAILED|failures:$|^test .* FAILED' || echo "pass $i clean"
          done
