name: flake-probe

# TEMPORARY diagnostic, not a gate. Delete with its PR.
#
# `assert_settled` in dropdown_viewport_deep.rs compared whole `Bounds` with
# exact equality. The height-capped panel is laid out twice per frame by the
# positioner -- once at `MaxContent` to pick a side, once at the cap -- and
# `debug_bounds` reports whichever pass wrote last, so its height was ambiguous
# by one pixel. That read as a profile dependency (40/40 failures at -O0, 0/40 at
# -O1/-O3, same binary and machine) but the delta was always 125px vs 126px and
# the origin never moved, so it was the measurement seam, not the layout.
#
# This is the regression check for the tolerance fix: the same regime that failed
# 40 times out of 40 must now pass 40 times out of 40.

on:
  push:
    branches: [poracode/tidy-meadow-2d08ef3f]

permissions:
  contents: read

concurrency:
  group: flake-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: settle rate at -O0 after the tolerance fix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/rust-env

      - name: Count settle failures over 40 runs at -O0, one thread
        shell: bash
        run: |
          set -uo pipefail
          # --test-threads=1 on a single binary is what made this fail every
          # time before; the gate runs the whole workspace in parallel.
          fail=0
          for i in $(seq 1 40); do
            if ! cargo test --locked -p herogpui-components \
                 --test dropdown_viewport_deep -- --test-threads=1 > "run-$i.log" 2>&1; then
              fail=$((fail + 1))
              echo "--- run $i failed"
              grep -E 'panicked at|left|right|FAILED' "run-$i.log" | head -8 || true
            fi
            rm -f "run-$i.log"
          done
          echo "::notice::post-fix settle failures at -O0: $fail / 40"

      - name: Same 40 runs at the Cargo.toml profile
        shell: bash
        run: |
          set -uo pipefail
          # --config outranks the $CARGO_HOME override rust-env wrote.
          REAL=(--config 'profile.dev.opt-level=1' --config 'profile.dev.package."*".opt-level=3')
          fail=0
          for i in $(seq 1 40); do
            if ! cargo test --locked "${REAL[@]}" -p herogpui-components \
                 --test dropdown_viewport_deep -- --test-threads=1 > "run-$i.log" 2>&1; then
              fail=$((fail + 1))
              echo "--- run $i failed"
              grep -E 'panicked at|left|right|FAILED' "run-$i.log" | head -8 || true
            fi
            rm -f "run-$i.log"
          done
          echo "::notice::post-fix settle failures at -O1/-O3: $fail / 40"
