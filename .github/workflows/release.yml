name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$version" = "$cargo_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The full CI workflow -- fmt, clippy, audits, the three-OS test matrix via
  # .shots/run-tests.sh, docs, install, the -O1/-O3 suite and the wasm build --
  # run on the tagged commit itself. Nothing below is built, released or
  # published unless its aggregating `ci` job succeeds.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-gallery:
    needs: [plan, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            source: target/release/herogpui-gallery.exe
            asset: x86_64-pc-windows-msvc.exe
          - runner: macos-15
            source: target/release/herogpui-gallery
            asset: aarch64-apple-darwin
          - runner: ubuntu-24.04
            source: target/release/herogpui-gallery
            asset: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            source: target/release/herogpui-gallery
            asset: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev \
            libfreetype-dev
      # No setup step before cargo: the workspace builds on the published
      # `gpui-pre` family with no `[patch.crates-io]` overrides.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p herogpui-gallery
      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.source }}" "dist/herogpui-${{ needs.plan.outputs.version }}-${{ matrix.asset }}"
          if [ "${{ runner.os }}" != "Windows" ]; then chmod 755 dist/herogpui-*; fi
      - uses: actions/upload-artifact@v6
        with:
          name: gallery-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  prepare-release:
    needs: [plan, build-gallery]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: gallery-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: |
            dist/*
          if-no-files-found: error

  github-release:
    needs: [plan, prepare-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: release-bundle
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* LICENSE NOTICE --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  publish-crates:
    # crates.io publish over OIDC trusted publishing: no registry secret is
    # stored anywhere. Each of the five crates must list this repository,
    # this workflow file and the `release` environment as a trusted
    # publisher on crates.io (Settings -> Trusted Publishing); the first
    # release of every crate is published by hand so the setting can exist.
    # Runs after the GitHub Release so a failed upload never leaves a tag
    # without binaries, and skips versions the registry already has so a
    # re-run after a partial publish continues where it stopped.
    needs: [plan, ci, github-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev \
            libfreetype-dev
      - uses: Swatinem/rust-cache@v2
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for crate in herogpui-core herogpui-theme herogpui-components herogpui herogpui-gallery; do
            if curl -fsS -A "herogpui-release (github actions)" \
                 "https://crates.io/api/v1/crates/$crate/$VERSION" >/dev/null 2>&1; then
              echo "$crate $VERSION is already on crates.io; skipping"
              continue
            fi
            cargo publish -p "$crate" --locked
          done
