[package]
name = "herogpui-gallery"
description = "HeroGPUI component gallery and documentation showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# The gallery shell -- pages, demo state, asset source -- is a library so the
# browser entry crate (`crates/herogpui-web`) reuses it instead of
# reimplementing it. Each entry point owns only its own platform: `main.rs`
# reads `HEROGPUI_*` from the environment and opens a native window; the web
# crate reads a URL query string and runs in a canvas.
[lib]
name = "herogpui_gallery"
path = "src/lib.rs"

[[bin]]
name = "herogpui-gallery"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
prettyplease.workspace = true
syn.workspace = true
herogpui-core.workspace = true
herogpui-theme = { workspace = true, features = ["serde"] }
herogpui-components = { workspace = true, features = ["gallery-source"] }
herogpui.workspace = true

# Theme hot reload for `HEROGPUI_THEME_DIR` (see `src/main.rs`), native only:
# the web build links this crate's library and has no file system to poll.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
herogpui-theme = { workspace = true, features = ["serde", "watch"] }

# build.rs reads the website's generated examples to compile them as tests.
[build-dependencies]
serde_json = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
