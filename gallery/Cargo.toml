[package]
name = "herogpui-gallery"
description = "HeroGPUI component gallery and documentation showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# The gallery shell -- pages, demo state, asset source -- is a library so the
# browser entry crate (`crates/herogpui-web`) reuses it instead of
# reimplementing it. Each entry point owns only its own platform: `main.rs`
# reads `HEROGPUI_*` from the environment and opens a native window; the web
# crate reads a URL query string and runs in a canvas.
[lib]
name = "herogpui_gallery"
path = "src/lib.rs"

[[bin]]
name = "herogpui-gallery"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
prettyplease.workspace = true
syn.workspace = true
herogpui-core.workspace = true
herogpui-theme.workspace = true
herogpui-components = { workspace = true, features = ["gallery-source"] }
herogpui.workspace = true

[lints]
workspace = true
