<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeroGPUI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Match the theme the gallery is about to render, so the loading
         screen does not flash a different colour before the first frame.
         The boot script below adds `dark` to <html> before this is painted. */
      :root {
        --loading-bg: #eaf0fb;
        --loading-fg: #070709;
        --loading-accent: #8b7bff;
      }

      :root.dark {
        --loading-bg: #070709;
        --loading-fg: #eaf0fb;
        --loading-accent: #8b7bff;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Open Sans', 'Helvetica Neue', sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background: var(--loading-bg);
        color: var(--loading-fg);
      }

      /* GPUI's web platform appends the canvas to <body> and sizes it to the
         viewport itself; these rules only cover the moment before it does. */
      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #loading {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .spinner {
        border: 4px solid color-mix(in srgb, var(--loading-fg) 10%, transparent);
        border-left-color: var(--loading-accent);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: #d32f2f;
        padding: 20px;
        text-align: center;
      }
    </style>
    <script>
      // Adopt the embedding page's appearance before the first paint, so
      // the loading screen matches the theme the gallery is about to render.
      // Same-origin embeds can read the parent; cross-origin ones keep the
      // default (or their own ?theme=dark, applied by the boot script).
      try {
        if (
          window.parent !== window &&
          window.parent.document.documentElement.classList.contains('dark')
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {
        // Cross-origin embedding: keep the default light loading screen.
      }
    </script>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading HeroGPUI...</p>
    </div>
    <script type="module">
      // Resolve sibling assets (herogpui_web.js, and the .wasm it loads)
      // against the directory holding this document, whatever URL form
      // served it: "/gallery/index.html?story=x" or the rewritten bare
      // "/gallery?story=x". Strip a trailing index.html first, then ensure
      // a trailing slash so URL resolution stays in the gallery directory.
      function assetUrl(name) {
        const dir = window.location.href
          .replace(/[?#].*$/, '')
          .replace(/index\.html$/, '')
          .replace(/\/?$/, '/');
        return new URL(name, dir).href;
      }

      // The host page's live appearance wins over the ?theme= query (the
      // query is a snapshot taken when the iframe was created), and an
      // explicit ?theme= wins over the light default.
      function queryDark() {
        return new URLSearchParams(window.location.search).get('theme') === 'dark';
      }
      function parentDark() {
        if (window.parent === window) return null;
        try {
          return window.parent.document.documentElement.classList.contains('dark');
        } catch (error) {
          return null; // cross-origin embed: fall back to the query string
        }
      }

      // While booting, keep the loading screen on the theme the gallery will
      // actually start in.
      function reflectTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
      }

      // After boot, follow the host page's theme live, so the gallery never
      // sits in a dark page wearing a light theme.
      function followParentTheme() {
        if (window.parent === window) return;
        let parentRoot;
        try {
          parentRoot = window.parent.document.documentElement;
        } catch (error) {
          return; // cross-origin: the boot-time ?theme= snapshot is the best we can do
        }
        let previous = parentRoot.classList.contains('dark');
        new MutationObserver(() => {
          const dark = parentRoot.classList.contains('dark');
          if (dark !== previous) {
            previous = dark;
            set_theme(dark);
          }
        }).observe(parentRoot, { attributes: true, attributeFilter: ['class'] });
      }

      async function boot() {
        const loading = document.getElementById('loading');
        reflectTheme(parentDark() ?? queryDark());
        try {
          // Dynamic import: the URL form serving this page varies (see
          // assetUrl), so the module URL is computed at boot time.
          const { default: init, run, set_theme } = await import(
            assetUrl('herogpui_web.js')
          );
          await init();
          // `undefined` lets the wasm side resolve the page from the query
          // string (?story=<slug> or ?page=<Nav Title>). Component docs also
          // pass ?preview=component&section=<heading> so GPUI constructs only
          // that example without the gallery shell.
          run(undefined, parentDark() ?? queryDark());
          followParentTheme();
          loading?.remove();
        } catch (error) {
          console.error('Failed to initialize HeroGPUI:', error);
          if (loading) {
            loading.innerHTML = `
              <div class="error">
                <h2>Failed to load the gallery</h2>
                <p>${error.message || error}</p>
                <p style="margin-top: 10px; font-size: 14px;">
                  Please check the console for more details.
                </p>
              </div>
            `;
          }
        }
      }

      boot();
    </script>
  </body>
</html>
