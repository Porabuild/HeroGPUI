<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeroGPUI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Match the theme the gallery is about to render, so the loading
         screen does not flash a different colour before the first frame.
         The boot script below adds `dark` to <html> before this is painted. */
      :root {
        --loading-bg: #eaf0fb;
        --loading-fg: #070709;
        --loading-accent: #8b7bff;
      }

      :root.dark {
        --loading-bg: #070709;
        --loading-fg: #eaf0fb;
        --loading-accent: #8b7bff;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Open Sans', 'Helvetica Neue', sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background: var(--loading-bg);
        color: var(--loading-fg);
      }

      /* GPUI's web platform appends the canvas to <body> and sizes it to the
         viewport itself; these rules only cover the moment before it does. */
      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #loading {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .spinner {
        border: 4px solid color-mix(in srgb, var(--loading-fg) 10%, transparent);
        border-left-color: var(--loading-accent);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: #d32f2f;
        padding: 20px;
        text-align: center;
      }

      /* A preview deployment whose own artifact CI had not published yet runs
         master's latest instead (web/scripts/gallery-artifact.mjs); say so. */
      .stale-build {
        position: fixed;
        z-index: 2;
        bottom: 8px;
        left: 8px;
        max-width: calc(100% - 16px);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
        background: color-mix(in srgb, #f5a524 20%, var(--loading-bg));
        color: var(--loading-fg);
        border: 1px solid color-mix(in srgb, #f5a524 60%, transparent);
      }
    </style>
    <script>
      // Adopt the embedding page's appearance before the first paint, so
      // the loading screen matches the theme the gallery is about to render.
      // Same-origin embeds can read the parent; cross-origin ones keep the
      // default (or their own ?theme=dark, applied by the boot script).
      try {
        if (
          window.parent !== window &&
          window.parent.document.documentElement.classList.contains('dark')
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {
        // Cross-origin embedding: keep the default light loading screen.
      }
    </script>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading HeroGPUI...</p>
    </div>
    <script type="module">
      // Resolve sibling assets (herogpui_web.js, and the .wasm it loads)
      // against the directory holding this document, whatever URL form
      // served it: "/gallery/index.html?story=x" or the rewritten bare
      // "/gallery?story=x". Strip a trailing index.html first, then ensure
      // a trailing slash so URL resolution stays in the gallery directory.
      function assetUrl(name) {
        const dir = window.location.href
          .replace(/[?#].*$/, '')
          .replace(/index\.html$/, '')
          .replace(/\/?$/, '/');
        const url = new URL(name, dir);
        // The docs iframe appends the installed WASM hash as `v`. Carry it
        // onto both the glue module and the explicit WASM URL below so a
        // deploy cannot reuse a cached artifact with a newer loader.
        const version = new URLSearchParams(window.location.search).get('v');
        if (version) url.searchParams.set('v', version);
        return url.href;
      }

      // The host page's live appearance wins over the ?theme= query (the
      // query is a snapshot taken when the iframe was created), and an
      // explicit ?theme= wins over the light default.
      function queryDark() {
        return new URLSearchParams(window.location.search).get('theme') === 'dark';
      }

      let wasmSetPreviewSection;
      let wasmSetPreviewStory;
      let wasmSetTheme;
      // The latest selection/theme asked for before the module finished
      // booting; applied once it has.
      let pendingPreview;
      let pendingDark;

      function applyPreview(preview) {
        if (preview.story) {
          wasmSetPreviewStory(preview.story, preview.section);
        } else {
          wasmSetPreviewSection(preview.section);
        }
      }

      // The host drives one live instance over this bridge:
      //   { type: 'herogpui:preview-section', section, story? }  switch example
      //     (and component, when `story` is given) without rebooting wasm;
      //   { type: 'herogpui:set-theme', dark }  follow the host's appearance,
      //     which a cross-origin host cannot otherwise share.
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || typeof message.type !== 'string') return;
        if (message.type === 'herogpui:preview-section' && typeof message.section === 'string') {
          const preview = {
            section: message.section,
            story: typeof message.story === 'string' ? message.story : undefined,
          };
          if (wasmSetPreviewSection) applyPreview(preview);
          else pendingPreview = preview;
        } else if (message.type === 'herogpui:set-theme' && typeof message.dark === 'boolean') {
          if (wasmSetTheme) wasmSetTheme(message.dark);
          else pendingDark = message.dark;
          reflectTheme(message.dark);
        }
      });

      function parentDark() {
        if (window.parent === window) return null;
        try {
          return window.parent.document.documentElement.classList.contains('dark');
        } catch (error) {
          return null; // cross-origin embed: fall back to the query string
        }
      }

      // While booting, keep the loading screen on the theme the gallery will
      // actually start in.
      function reflectTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
      }

      // After boot, follow the host page's theme live, so the gallery never
      // sits in a dark page wearing a light theme.
      function followParentTheme() {
        if (window.parent === window) return;
        let parentRoot;
        try {
          parentRoot = window.parent.document.documentElement;
        } catch (error) {
          return; // cross-origin: the boot-time ?theme= snapshot is the best we can do
        }
        let previous = parentRoot.classList.contains('dark');
        new MutationObserver(() => {
          const dark = parentRoot.classList.contains('dark');
          if (dark !== previous) {
            previous = dark;
            wasmSetTheme?.(dark);
          }
        }).observe(parentRoot, { attributes: true, attributeFilter: ['class'] });
      }

      // An embedded preview must not take keyboard focus from the page that
      // embeds it. GPUI's web platform focuses its hidden IME textarea as soon
      // as the window exists (and again whenever a text input gains GPUI
      // focus), which moves the host document's focus into this frame on load:
      // the reader's Cmd/Ctrl+K and page scrolling keys then land here until
      // they click back out. So until the reader interacts with the frame --
      // a pointer press inside it, or keyboard focus arriving on its window
      // (Tab from the host) -- programmatic focus() calls are held, and the
      // last one is replayed at that moment. After that, focus behaves
      // normally. The standalone gallery (not framed) is untouched.
      function holdFocusUntilInteraction() {
        if (window.parent === window) return;
        const proto = HTMLElement.prototype;
        const focus = proto.focus;
        let held;
        let released = false;
        proto.focus = function (options) {
          if (released) return focus.call(this, options);
          held = [this, options];
        };
        function release() {
          if (released) return;
          released = true;
          proto.focus = focus;
          window.removeEventListener('pointerdown', release, true);
          window.removeEventListener('focus', release);
          if (held && held[0].isConnected) focus.call(held[0], held[1]);
          held = undefined;
        }
        window.addEventListener('pointerdown', release, true);
        window.addEventListener('focus', release);
      }

      // Once the reader is working inside the frame, the host's site-search
      // shortcut would otherwise stop at GPUI. Forward it instead: the host
      // (web/src/components/site/command-palette.tsx) opens its palette on
      // { type: 'herogpui:shortcut', shortcut: 'search' } from its own frame.
      function forwardHostShortcuts() {
        if (window.parent === window) return;
        window.addEventListener(
          'keydown',
          (event) => {
            const search =
              (event.metaKey || event.ctrlKey) &&
              !event.altKey &&
              !event.shiftKey &&
              event.key.toLowerCase() === 'k';
            if (!search) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            window.parent.postMessage({ type: 'herogpui:shortcut', shortcut: 'search' }, '*');
          },
          true,
        );
      }

      async function boot() {
        const loading = document.getElementById('loading');
        holdFocusUntilInteraction();
        forwardHostShortcuts();
        reflectTheme(parentDark() ?? queryDark());
        // What the site build installed beside this page (status "exact",
        // "fallback", "local" or "missing"); written by
        // web/scripts/gallery-artifact.mjs, absent in a bare local copy.
        const buildInfo = fetch(assetUrl('build-info.json'))
          .then((response) => (response.ok ? response.json() : null))
          .catch(() => null);
        try {
          // Dynamic import: the URL form serving this page varies (see
          // assetUrl), so the module URL is computed at boot time.
          const wasmUrl = assetUrl('herogpui_web_bg.wasm');
          const {
            default: init,
            run,
            set_preview_section,
            set_preview_story,
            set_theme,
          } = await import(assetUrl('herogpui_web.js'));
          await init({ module_or_path: wasmUrl });
          wasmSetPreviewSection = set_preview_section;
          wasmSetPreviewStory = set_preview_story;
          wasmSetTheme = set_theme;
          // `undefined` lets the wasm side resolve the page from the query
          // string (?story=<slug> or ?page=<Nav Title>). Component docs also
          // pass ?preview=component&section=<heading> so GPUI constructs only
          // that example without the gallery shell.
          run(undefined, pendingDark ?? parentDark() ?? queryDark());
          if (pendingPreview) {
            applyPreview(pendingPreview);
            pendingPreview = undefined;
          }
          followParentTheme();
          loading?.remove();
          const build = await buildInfo;
          if (build?.status === 'fallback') {
            const note = document.createElement('div');
            note.className = 'stale-build';
            const commit = typeof build.commit === 'string' ? ` (${build.commit.slice(0, 7)})` : '';
            note.textContent = `Live preview from an earlier build${commit}: this revision's is still being built.`;
            document.body.append(note);
          }
          // Tell the host the instance is live, so it can drop its own
          // loading state without polling this document.
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'herogpui:ready' }, '*');
          }
        } catch (error) {
          console.error('Failed to initialize HeroGPUI:', error);
          const missing = (await buildInfo)?.status === 'missing';
          if (loading) {
            // Built with text nodes: the error message is not markup.
            const box = document.createElement('div');
            box.className = 'error';
            const title = document.createElement('h2');
            title.textContent = missing
              ? 'The live preview is not part of this build'
              : 'Failed to load the gallery';
            const detail = document.createElement('p');
            detail.textContent = missing
              ? 'This deployment was built without the WebAssembly gallery artifact.'
              : String(error?.message || error);
            const hint = document.createElement('p');
            hint.style.cssText = 'margin-top: 10px; font-size: 14px;';
            hint.textContent = 'Please check the console for more details.';
            box.append(title, detail);
            if (!missing) box.append(hint);
            loading.replaceChildren(box);
          }
        }
      }

      boot();
    </script>
  </body>
</html>
