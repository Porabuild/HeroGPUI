# Pins the toolchain so every machine and CI resolves the same rustc: a
# floating channel lets a Tuesday release silently invalidate every
# incremental cache and change rustfmt's output mid-project. Bump the version
# (and re-run the gates) deliberately. `rust-version` in Cargo.toml is this pin's
# release because the pre-1.0 workspace tracks the current stable Rust, which
# is also why CI has no separate MSRV job: every job already builds on the MSRV.
# Move both together; `.shots/package_audit.py` fails if they disagree.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
